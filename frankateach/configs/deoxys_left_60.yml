# LEFT arm client-side Deoxys configuration for synchronized 60 Hz recording.
PC:
  NAME: "nuc"
  IP: 192.168.100.201
NUC:
  NAME: "nuc"
  IP: 192.168.100.201
  PUB_PORT: 5566
  SUB_PORT: 5575
  GRIPPER_PUB_PORT: 5568
  GRIPPER_SUB_PORT: 5577
ROBOT:
  IP: 192.168.100.202
CONTROL:
  STATE_PUBLISHER_RATE: 120
  POLICY_RATE: 60
  TRAJ_RATE: 500
  ZMQ_NOBLOCK: true
ARM_LOGGER:
  CONSOLE: {LOGGER_NAME: "arm_logger", LEVEL: "info", USE: true}
  FILE: {LOGGER_NAME: "logs/deoxys_control_arm_program_left.log", LEVEL: "debug", USE: true}
GRIPPER_LOGGER:
  CONSOLE: {LOGGER_NAME: "gripper_logger", LEVEL: "info", USE: true}
  FILE: {LOGGER_NAME: "logs/deoxys_control_gripper_program_left.log", LEVEL: "debug", USE: true}
